<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepfake Detector Frontend</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --success: #22c55e;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 60%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: min(1200px, 100%);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .topbar {
        padding: 18px 24px;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2vw, 2.2rem);
      }

      .topbar p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .frame-wrap {
        width: 100%;
        height: 82vh;
        min-height: 700px;
        background: #020817;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: white;
      }

      .fallback {
        display: none;
        padding: 40px 24px;
        text-align: center;
        color: var(--muted);
      }

      .fallback.show {
        display: block;
      }

      .fallback strong {
        color: var(--text);
      }

      .status {
        margin-top: 12px;
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Deepfake / Real Image Detector</h1>
        <p>Upload an image to estimate whether it is REAL or FAKE.</p>
      </div>

      <div class="frame-wrap">
        <iframe id="gradioFrame" src="http://127.0.0.1:7860/" title="Deepfake Detector UI"></iframe>
      </div>

      <div id="fallback" class="fallback">
        <strong>Gradio app is not running.</strong>
        <div>Start the backend with:</div>
        <div class="status">python app.py</div>
      </div>
    </div>

    <script>
      const frame = document.getElementById('gradioFrame');
      const fallback = document.getElementById('fallback');

      function checkFrame() {
        try {
          const hasLoaded = frame.contentWindow && frame.contentWindow.location.href;
          if (hasLoaded) {
            fallback.classList.remove('show');
          }
        } catch (error) {
          fallback.classList.add('show');
        }
      }

      frame.addEventListener('load', checkFrame);
      setTimeout(checkFrame, 2000);
    </script>
  </body>
</html>
